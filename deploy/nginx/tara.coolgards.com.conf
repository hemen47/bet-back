# /etc/nginx/sites-available/tara.coolgards.com
# Mines Mini App. Everything goes to the Next.js container (127.0.0.1:47310).
# Next proxies /api/* to the NestJS container itself (see bet-front/next.config.ts).

server {
    listen 80;
    server_name tara.coolgards.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tara.coolgards.com;

    # Cloudflare origin certificate. The default one covers coolgards.com and *.coolgards.com.
    ssl_certificate     /etc/nginx/ssl/coolgards/coolgards.pem;
    ssl_certificate_key /etc/nginx/ssl/coolgards/coolgards.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:47310;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # Behind Cloudflare, $remote_addr is a Cloudflare edge IP. CF-Connecting-IP
        # is the real player, which the API's rate limiter keys on.
        proxy_set_header X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        'upgrade';
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;
    }
}
