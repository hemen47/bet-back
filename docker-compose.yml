# Mines Mini App: NestJS API + Next.js frontend, behind the host's nginx.
#
# Expects the two repos cloned side by side:
#   ~/bet/bet-back   (this file, .env)
#   ~/bet/bet-front
#
#   cd ~/bet/bet-back && docker compose up -d --build
#
#   Cloudflare -> nginx (tara.coolgards.com) -> 127.0.0.1:47310 web (Next.js)
#                                                  └─ /api/* proxied by Next -> api:47311 (NestJS) -> Atlas
#
# Only the web container is published, on 127.0.0.1. The API is reachable
# only inside the compose network. Nothing uses port 3000.
# MongoDB runs on Atlas (MONGODB_URI in .env).

x-public-url: &public_url ${PUBLIC_URL:-https://tara.coolgards.com}

services:
  api:
    build: .
    image: bet-api
    container_name: bet-api
    restart: unless-stopped
    env_file: .env
    environment:
      # These override .env, so the same .env also works for local dev.
      NODE_ENV: production
      PORT: 47311
      TRUST_PROXY: 'true'
      TELEGRAM_BOT_MODE: webhook
      # Telegram posts to <url>/telegram/webhook, i.e. through Next's /api proxy.
      TELEGRAM_WEBHOOK_URL: ${PUBLIC_URL:-https://tara.coolgards.com}/api
      MINI_APP_URL: *public_url
      CORS_ORIGINS: *public_url
    expose:
      - '47311'
    networks: [bet]

  web:
    build:
      context: ../bet-front
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_BOT_USERNAME: ${BOT_USERNAME:-tarabet_bot}
        API_INTERNAL_URL: http://api:47311
    image: bet-web
    container_name: bet-web
    restart: unless-stopped
    environment:
      PORT: 47310
    depends_on:
      - api
    ports:
      - '127.0.0.1:${WEB_PORT:-47310}:47310'
    networks: [bet]

networks:
  bet:
    name: bet
